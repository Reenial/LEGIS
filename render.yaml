databases:
  - name: app-db
    databaseName: appdb
    user: dbuser
    plan: free

services:
  - type: web
    name: api-service
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL # public URL of web-frontend, e.g. https://web-frontend.onrender.com
        sync: false

  - type: web
    name: web-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api-service
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
