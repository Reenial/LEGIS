# Local full stack: docker compose up --build
# Frontend: http://localhost (API at http://localhost/api)  Backend directly: http://localhost:10000
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      # Runs in this order on the first start of an empty volume only.
      # To reload after a schema change: docker compose down -v
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/dev/sample-data.sql:/docker-entrypoint-initdb.d/03-sample-data.sql:ro
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "10000:10000"
    environment:
      PORT: 10000
      NODE_ENV: development
      DATABASE_URL: postgres://dbuser:password@db:5432/appdb
      SESSION_SECRET: local-dev-secret
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FRONTEND_URL: http://localhost
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      # nginx proxies /api to the backend (frontend/nginx.conf.template)
      API_UPSTREAM: http://backend:10000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
