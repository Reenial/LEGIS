databases:
  - name: app-db
    databaseName: appdb
    user: dbuser
    plan: free

services:
  - type: web
    name: ferlostandfound-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL # public URL of the website, e.g. https://ferlostandfound.onrender.com (CORS)
        sync: false

  - type: web
    name: ferlostandfound
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Public URL of the backend, e.g. https://ferlostandfound-api.onrender.com
      # nginx proxies /api there, so the browser only sees this service's origin,
      # and redirects /wake-api to its /health to start it after it went to sleep.
      - key: API_UPSTREAM
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
