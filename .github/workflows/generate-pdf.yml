name: Compile Documentation PDF

on:
  workflow_dispatch:
    inputs:
      group_number:
        description: "Student Group ID (e.g. G03.2)"
        required: true
        default: "Gxx.x"
      app_acronym:
        description: "App Acronym (e.g. GYMREC)"
        required: true
        default: "AppAcronym"
      version:
        description: "Deliverable Version (v1 or v2)"
        required: true
        default: "v1"

jobs:
  build-pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tooling
        run: sudo apt-get update && sudo apt-get install -y pandoc weasyprint
      - name: Build PDF Deliverable
        run: |
          mkdir -p docs/deliverables
          FILE_NAME="SE26_${{ github.event.inputs.group_number }}_${{ github.event.inputs.app_acronym }}_${{ github.event.inputs.version }}.pdf"
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          root = Path("docs")
          files = [root / "Home.md"] + sorted(root.glob("[1-9]*.md")) + sorted(root.glob("[AB]-*.md"))
          parts = []
          for f in files:
              text = f.read_text().replace("<details>", "<details open>")
              if f.name.startswith(("5-", "6-", "7-")):
                  text = "> This chapter contains unfinished course template material.\n\n" + text
              text = re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", lambda m: m[0] if (root / m[2]).exists() or m[2].startswith("http") else "[Diagram placeholder: " + m[1] + "]", text)
              parts.append('<div class="chapter">\n\n' + text + '\n\n</div>')
          (root / "full-report.md").write_text("\n\n".join(parts))
          (root / "pdf.css").write_text("@page {size:A4 landscape; margin:15mm; @bottom-center {content:counter(page)}} body{font:10pt sans-serif;line-height:1.4} .chapter{break-before:page} h1,h2,h3{break-after:avoid} table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:9pt} th,td{border:1px solid #bbc;padding:6px;vertical-align:top;overflow-wrap:anywhere} th{background:#eef} tr{break-inside:avoid} img{max-width:100%;max-height:155mm;object-fit:contain} pre{white-space:pre-wrap;font-size:8pt} a{color:#205c83}")
          PYCODE
          cd docs
          pandoc full-report.md --from gfm --to html5 --standalone --toc --toc-depth=2 --metadata title="Lost & Found - Project Documentation" --css=pdf.css -o full-report.html
          weasyprint full-report.html "deliverables/$FILE_NAME"
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: project-documentation
          path: docs/deliverables/SE26_${{ github.event.inputs.group_number }}_${{ github.event.inputs.app_acronym }}_${{ github.event.inputs.version }}.pdf
          if-no-files-found: error
