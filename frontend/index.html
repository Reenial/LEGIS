<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost &amp; Found</title>
    <link rel="stylesheet" href="src/styles/main.css" />
    <!-- Google Identity Services, used by the sign-in page (UC-003) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <header id="app-header">
      <div class="title">Lost & Found</div>
      <div class="notification">
        <img src="src/assets/icons/bell.png" class="icons" />
      </div>
      <div class="user">
        <img src="src/assets/icons/profile.png" class="icons" />
      </div>
    </header>
  
    <main>
      <input id="search" type="search" placeholder="Pretraži predmete..." />

      <!-- nadodane kategorije -->
      <div class="categories">
        <h3>Kategorije</h3>

        <div class="category-list">
          <button class="category">Sve</button>
          <button class="category">Elektronika</button>
          <button class="category">Dokumenti</button>
          <button class="category">Odjeća</button>
          <button class="category">Ključevi</button>
          <button class="category">Torbe</button>
          <button class="category">Ostalo</button>
        </div>
      </div>


      <div class="actions">
        <button class="button1">Moje objave</button>
        <button class="button2">Objavi izgubljeni ili pronađeni predmet</button>
      </div>
    </main>

    <nav>
      <a href="index.html"
        ><img class="icons" src="src/assets/icons/home.png"
      /></a>
      <a href="#search"
        ><img class="icons" src="src/assets/icons/search.png"
      /></a>
      <a href="#chat"><img class="icons" src="src/assets/icons/chat.png" /></a>
      <a href="#settings"
        ><img class="icons" src="src/assets/icons/settings.png"
      /></a>
    </nav>

    <script type="module" src="/src/main.js"></script>
    <script src="src/test-data.js"></script>
  </body>
</html>
